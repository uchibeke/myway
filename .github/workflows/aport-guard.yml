# APort Repository Guard
# Report-only demonstration installation for the 2026-09-30 launch package.
# Docs: https://aport.io/quickstart/github
#
# This file lives on an isolated demonstration base branch. It is pinned to the
# full commit SHA of the current release, which GitHub's workflow syntax
# reference calls the safest way to reference an action.

name: APort Repository Guard
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, review_requested, review_request_removed]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  aport:
    name: APort / OAP code.repository.merge.v1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: aporthq/policy-verify-action@349359985993ab02045fe0032b432173a4dc6666 # v1.0.13
        with:
          mode: auto
          protected-paths: "docs/aport-deny-test.txt"
